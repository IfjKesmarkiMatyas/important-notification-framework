<section class="wrap">
  <div class="auth-tools">
    <app-theme-toggle />
    <button class="btn ghost icon" type="button" (click)="i18n.toggle()">{{ i18n.locale() }}</button>
  </div>
  <div class="panel narrow">
    <app-logo size="lg" />
    @if (invalid()) {
      <h1>{{ i18n.t().inviteInvalid }}</h1>
    } @else if (email()) {
      <h1>{{ i18n.t().join }}</h1>
      <p class="mute">{{ email() }}</p>
      <form (ngSubmit)="submit()">
        <label class="field">
          <span>{{ i18n.t().displayName }}</span>
          <input name="displayName" [(ngModel)]="displayName" required />
        </label>
        <label class="field">
          <span>{{ i18n.t().password }}</span>
          <input name="password" type="password" minlength="8" [(ngModel)]="password" required />
        </label>
        <button class="btn" type="submit" [disabled]="busy()">{{ i18n.t().join }}</button>
      </form>
    }
  </div>
</section>
