<div class="kicker">{{ i18n.t().tower }}</div>
<h1>{{ i18n.t().tower }}</h1>
<p class="mute intro">{{ i18n.t().towerHint }}</p>

<app-tower-system
  [sources]="sources()"
  [engine]="engineSwitch()"
  [golden]="golden()"
  [busy]="busy()"
  (mode)="setMode($event)"
  (run)="run($event)"
  (score)="score()"
/>

<div class="workspace">
  <app-tower-inbox
    [events]="events()"
    [sources]="sources()"
    [selectedId]="selected()?.id ?? null"
    [family]="family()"
    [sourceId]="sourceId()"
    (familyChange)="setFamily($event)"
    (sourceIdChange)="setSource($event)"
    (open)="open($event)"
    (download)="export()"
  />
  <app-tower-story
    [detail]="selected()"
    [trail]="trail()"
    [busy]="busy()"
    (decide)="decide()"
  />
</div>
