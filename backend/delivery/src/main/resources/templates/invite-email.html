<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Notif</title>
</head>
<body style="margin:0;padding:0;background:#0C0E12;color:#F4F1EA;font-family:Inter,Segoe UI,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0C0E12;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellspacing="0" cellpadding="0" style="background:#14181F;border:1px solid rgba(244,241,234,0.08);border-radius:12px;padding:32px;">
          <tr>
            <td style="font-size:13px;letter-spacing:0.12em;color:#C8F54A;text-transform:uppercase;">Notif</td>
          </tr>
          <tr>
            <td style="padding-top:16px;font-size:22px;font-weight:600;" th:text="${heading}">Meghívó</td>
          </tr>
          <tr>
            <td style="padding-top:12px;font-size:15px;line-height:1.5;color:#F4F1EA;" th:text="${body}">
              Meghívó a Notifra.
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;">
              <a th:href="${inviteUrl}"
                 th:text="${cta}"
                 style="display:inline-block;background:#C8F54A;color:#0C0E12;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px;">
                Elfogadom a meghívást
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding-top:24px;font-size:12px;color:#8A909A;" th:text="${footnote}">A link 7 napig él.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
